[versions]
agp = "8.13.1"
kotlin = "2.2.21"
core-ktx = "1.17.0"
junit = "4.13.2"
androidx-test-ext-junit = "1.3.0"
lifecycle-version = "2.9.4"
activity-compose = "1.11.0"
compose-bom = "2025.11.00"
navigation-compose = "2.9.6"
hilt = "2.57.2"
hilt-utils = "1.3.0"
ksp = "2.2.21-2.0.4"
timber = "5.0.1"
room = "2.8.3"
workmanager = "2.11.0"
retrofit = "3.0.0"
retrofit-mockwebserver = "5.3.2"
gson = "2.13.2"
coroutines = "1.10.2"
logging-interceptor = "5.3.2"
ui-text-google-fonts = "1.9.4"
tradingview = "4.0.0"
chart-compose = "0.2.0"
mockk = "1.14.6"
paging = "3.3.6"
paging-compose = "3.3.6"
coil = "2.7.0"
datastore = "1.1.7"
truth = "1.4.5"
ui-text = "1.9.4"
foundation = "1.9.5"

[libraries]

#UI AND LIFECYCLE COMPONENT
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle-version" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-version" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle-version" }
lifecycle-compiler = { group = "androidx.lifecycle", name = "lifecycle-compiler", version.ref = "lifecycle-version" }
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
tradingview = { group = "com.tradingview", name = "lightweightcharts", version.ref = "tradingview" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
navigation-compose-test = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigation-compose" }
compose-charts = { group = "io.github.ehsannarmani", name = "compose-charts", version.ref = "chart-compose" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

#JETPACK COMPOSE COMPONENT
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-animation = { group = "androidx.compose.animation", name= "animation" }
ui-material = { group = "androidx.compose.material", name = "material" }
material3 = { group = "androidx.compose.material3", name = "material3" }
material-icons-core = { group = "androidx.compose.material", name="material-icons-core" }
material-icons-extended = { group = "androidx.compose.material", name="material-icons-extended" }
ui-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-ui-text = { group = "androidx.compose.ui", name = "ui-text", version.ref = "ui-text" }
androidx-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts", version.ref = "ui-text-google-fonts" }

#KOTLIN COROUTINES
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

#DEPENDENCY INJECTOR
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-utils" }
timber-core = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

#NETWORKING
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
retrofit-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "logging-interceptor" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

#LOCAL DATABASE PERSISTANCE
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
datastore-preferences = { group="androidx.datastore", name="datastore-preferences", version.ref="datastore" }

#PAGING
paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging-compose" }

#UNIT TEST
junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref="coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
retrofit-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "retrofit-mockwebserver" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

#INSTRUMENTED TEST
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
hiltAndroid = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kspSupport = { id = "com.google.devtools.ksp", version.ref = "ksp" }

